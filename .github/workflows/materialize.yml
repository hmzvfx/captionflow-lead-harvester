name: Materialize Captionflow Harvester

on:
  push:
    branches: [main]
    paths:
      - ".project-payload-*"
      - ".github/workflows/materialize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble project
        shell: bash
        run: |
          cat .project-payload-* | base64 -d > /tmp/captionflow-project.tar.gz
          echo "b383fc1817248abf4bc199c4868f43376e58416ddd11f2784870232ca94cd324  /tmp/captionflow-project.tar.gz" | sha256sum -c -
          tar -xzf /tmp/captionflow-project.tar.gz -C .
          rm -f .project-payload-* .bootstrap .github/workflows/materialize.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Commit final project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build Captionflow Lead Harvester"
          git push
